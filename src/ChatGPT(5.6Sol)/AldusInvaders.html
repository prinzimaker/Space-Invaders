const glyphs=new Map();
function glyph(ch){
  if(glyphs.has(ch))return glyphs.get(ch);
  let original=String(ch||' ');
  if(original==='·')original='.';
  if(original==='–'||original==='—')original='-';
  if(original==='’'||original==='‘')original="'";
  if(original==='“'||original==='”')original='"';
  if(original.length){
    const normalized=original.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(normalized)original=normalized[0];
  }
  let code=original.charCodeAt(0);
  if(code<32||code>126)code=63;
  const start=(code-32)*8,m=new Uint8Array(64);
  for(let y=0;y<8;y++){
    const bits=FONT8[start+y];
    for(let x=0;x<8;x++)m[y*8+x]=(bits>>(7-x))&1;
  }
  glyphs.set(ch,m);
  return m;
}

const BASE_GAME_TICK=.020;
const GAME_SPEEDS=[{label:'LENTA',factor:1.4},{label:'NORMALE',factor:1},{label:'VELOCE',factor:.72}];
let gameSpeedIndex=(()=>{try{const n=Number(localStorage.getItem('aldus-invasion-speed'));return Number.isInteger(n)&&n>=0&&n<GAME_SPEEDS.length?n:1}catch{return 1}})();

// Presentazione originale
const pres={};
const PRES_WALK_SEQ=[0,1,2,1];
const PRES_WALK_BOB=[0,-1,0,-1];

function initPresentation(){
  stopMusic();
  cls();
  rect(0,197,319,199,8);

  Object.assign(pres,{
    acc:0,t:0,b:0,flagP:true,d:150,
    p:310,playerY:186,playerFrame:0,walkPhase:0,
    rocketActive:true,rocketY:-23,rocketFrame:1,
    ufoY:110,ufoX:0,ufoFrame:1,
    alienTick:0,
    bombActive:false,bombDropped:false,bombX:0,bombY:0,bombDX:-1.45,bombDY:6.2,
    waitTop:false
  });

  put(ASSETS.ufo[0][1],5,110,'pset');
  put(ASSETS.player[0],pres.p,pres.playerY,'pset');
  put(ASSETS.razzo[pres.rocketFrame],50,pres.rocketY,'pset');
  raw(ASSETS.authorGraphic,46,11,true);
}

function presentationRocketStep(){
  if(!pres.rocketActive)return;
  if(pres.t<80)return;

  put(ASSETS.razzo[pres.rocketFrame],50,pres.rocketY,'xor');

  let fall;
  if(pres.rocketY<80)fall=6.0;
  else if(pres.rocketY<130)fall=4.0;
  else if(pres.rocketY<156)fall=2.4;
  else if(pres.rocketY<169)fall=1.25;
  else fall=.55;

  pres.rocketY=Math.min(174,pres.rocketY+fall);
  pres.rocketFrame=pres.rocketFrame===1?2:1;

  if(pres.rocketY>=174){
    pres.rocketY=174;
    pres.rocketActive=false;
    put(ASSETS.razzo[0],50,174,'pset');
    beep(90,.18);
  }else{
    put(ASSETS.razzo[pres.rocketFrame],50,pres.rocketY,'xor');
    const braking=Math.max(0,(pres.rocketY-120)/54);
    beep(75+braking*150,.06);
  }
}

function presentationPlayerStep(){
  if(!pres.flagP)return;

  const oldBob=PRES_WALK_BOB[pres.walkPhase];
  put(
    ASSETS.player[pres.playerFrame],
    pres.p,
    pres.playerY+oldBob,
    'xor'
  );

  pres.p-=1.8;
  pres.walkPhase=(pres.walkPhase+1)%PRES_WALK_SEQ.length;
  pres.playerFrame=PRES_WALK_SEQ[pres.walkPhase];

  const newBob=PRES_WALK_BOB[pres.walkPhase];
  put(
    ASSETS.player[pres.playerFrame],
    pres.p,
    pres.playerY+newBob,
    'xor'
  );

  if(pres.p<=66){
    put(
      ASSETS.player[pres.playerFrame],
      pres.p,
      pres.playerY+newBob,
      'xor'
    );
    pres.flagP=false;
    pres.p=65;
    pres.playerFrame=0;
    put(ASSETS.player[0],65,186,'pset');
    put(ASSETS.razzo[0],50,174,'or');
  }
}

function presentationUfoStep(){
  put(ASSETS.ufo[0][pres.ufoFrame],5+pres.ufoX,pres.ufoY,'xor');
  if(pres.t>60)pres.ufoY-=1;
  pres.ufoX+=2;
  pres.ufoFrame^=1;
  put(ASSETS.ufo[0][pres.ufoFrame],5+pres.ufoX,pres.ufoY,'xor');
}

function maybeDropPresentationBomb(){
  if(pres.bombDropped||!pres.flagP)return;

  const ufoCenter = 5 + pres.ufoX + 12;
  const playerCenter = pres.p + 6;

  // Quando l'UFO è esattamente sopra al player in corsa, sgancia la bomba.
  if(ufoCenter >= playerCenter){
    pres.bombDropped = true;
    pres.bombActive = true;
    pres.bombX = ufoCenter;
    pres.bombY = pres.ufoY + 9;
    beep(220,.08);
  }
}

function presentationBombStep(){
  if(!pres.bombActive)return;

  put(ASSETS.enemyShot,pres.bombX,pres.bombY,'xor');

  pres.bombX += pres.bombDX;
  pres.bombY += pres.bombDY;

  // La bomba sfiora il player senza colpirlo e prosegue verso il basso.
  if(pres.bombY > 194){
    pres.bombActive = false;
    return;
  }

  put(ASSETS.enemyShot,pres.bombX,pres.bombY,'xor');
}

function presentationAliensStep(){
  // Gli alieni restano animati, ma con 300 ms aggiuntivi tra un frame e l'altro:
  // a 10 fps questo significa cambiare sprite ogni 4 tick = 400 ms.
  pres.alienTick++;
  if(pres.alienTick >= 4){
    pres.alienTick = 0;
    pres.b ^= 1;
  }

  for(let r=0;r<5;r++){
    put(ASSETS.alien[r][pres.b],90,28+r*32,'pset');
  }
}

function presStep(){
  presentationUfoStep();
  presentationRocketStep();
  presentationPlayerStep();
  maybeDropPresentationBomb();
  presentationBombStep();
  presentationAliensStep();

  const ry=pres.rocketY;
  if(ry>=30&&ry<=40)printCell(5,15,'Giovanni ',7);
  if(ry>=58&&ry<=70)printCell(9,15,'Vicky    ',7);
  if(ry>=88&&ry<=100)printCell(13,15,'Aldus    ',7);
  if(ry>=120&&ry<=135)printCell(17,15,'Giacomino',7);
  if(ry>=150&&ry<=166)printCell(21,15,'Mimmo    ',7);

  if(!pres.rocketActive&&pres.t>=80){
    printCell(24,18,'<--- PLAYER',1+(pres.t%7));
  }

  printCell(1,10,'ALDUS INVASION 1 !',1+(pres.t%7));
  pres.t++;
}

function updatePresentation(dt){
  if(hit('Enter')||hit('Space')){
    startNewGame();
    return;
  }

  pres.acc+=dt;

  while(pres.acc>=.10){
    pres.acc-=.10;
    presStep();

    if(pres.t>=170){
      switchMode('topten',initTopTen);
      return;
    }
  }
}

function fxPixel(x,y,c,mode='xor'){
  x=qi(x);y=qi(y);
  if(x<0||x>=W||y<0||y>=H||!c)return;
  const p=y*W+x;
  if(mode==='xor')pixels[p]^=c;
  else if(mode==='pset')pixels[p]=c;
  else pixels[p]|=c;
}
function fxHLine(x1,y,x2,c,mode='xor'){
  x1=qi(x1);x2=qi(x2);y=qi(y);
  if(y<0||y>=H)return;
  if(x1>x2){const t=x1;x1=x2;x2=t}
  for(let x=x1;x<=x2;x++)fxPixel(x,y,c,mode);
}
function drawSkyAlienExplosion(frame,cx,cy,mode='xor'){
  cx=qi(cx);cy=qi(cy);
  const f=Math.max(0,Math.min(5,frame));

  // Esplosione aerea simmetrica e sospesa: stesso feeling dell'esplosione del razzo,
  // ma senza base a terra. Nucleo bianco/giallo, corona rossa e spilli diagonali.
  const rays=[2,4,6,8,10,12][f];
  const core=[1,2,3,4,3,2][f];

  // Nucleo caldo
  for(let dy=-core;dy<=core;dy++){
    const w=core-Math.floor(Math.abs(dy)/1.2);
    fxHLine(cx-w,cy+dy,cx+w,15,mode);
  }
  for(let dy=-(core+1);dy<=core+1;dy++){
    const w=Math.max(0,core+1-Math.ceil(Math.abs(dy)/1.2));
    if(w>0)fxHLine(cx-w,cy+dy,cx+w,14,mode);
  }

  // Anello interno rosso-arancio
  const ring = [
    [-2,-3],[0,-3],[2,-3],[-3,-2],[3,-2],[-3,0],[3,0],[-3,2],[3,2],[-2,3],[0,3],[2,3],
    [-1,-4],[1,-4],[-4,-1],[4,-1],[-4,1],[4,1],[-1,4],[1,4]
  ];
  for(const [dx,dy] of ring){
    fxPixel(cx+dx,cy+dy,(f<3?12:4),mode);
  }

  // Bracci principali dell'esplosione
  const hot = f<3 ? 14 : 12;
  const edge = f<3 ? 12 : 4;
  fxHLine(cx-rays,cy,cx-4,edge,mode);
  fxHLine(cx+4,cy,cx+rays,edge,mode);
  fxHLine(cx,cy-rays,cx,cy-4,edge,mode);
  fxHLine(cx,cy+4,cx,cy+rays,edge,mode);

  for(let i=4;i<=rays;i+=2){
    const c=i<rays-1?hot:edge;
    fxPixel(cx-i,cy,c,mode); fxPixel(cx+i,cy,c,mode);
    fxPixel(cx,cy-i,c,mode); fxPixel(cx,cy+i,c,mode);
  }

  // Spille diagonali e schegge pixel
  const diag = Math.max(2,rays-2);
  for(let i=2;i<=diag;i+=2){
    const c=i<diag?hot:edge;
    fxPixel(cx-i,cy-i,c,mode); fxPixel(cx+i,cy-i,c,mode);
    fxPixel(cx-i,cy+i,c,mode); fxPixel(cx+i,cy+i,c,mode);
  }

  // Nuvola esterna frastagliata, più ampia a metà esplosione
  if(f>=1){
    const cloud = [
      [-rays-1,-1],[-rays,1],[-rays+1,-3],[rays+1,1],[rays,-1],[rays-1,3],
      [-1,-rays-1],[1,-rays],[3,-rays+1],[-1,rays+1],[1,rays],[-3,rays-1],
      [-diag-1,-diag],[diag+1,-diag],[-diag-1,diag],[diag+1,diag]
    ];
    for(const [dx,dy] of cloud)fxPixel(cx+dx,cy+dy,4,mode);
  }

  // Bagliori puntiformi, per dare l'idea di esplosione "nel cielo"
  if(f>=2){
    const sparks = [
      [-rays-4,0],[rays+4,0],[0,-rays-4],[0,rays+4],
      [-diag-3,-diag-2],[diag+3,-diag-2],[-diag-3,diag+2],[diag+3,diag+2]
    ];
    for(const [dx,dy] of sparks)fxPixel(cx+dx,cy+dy,7,mode);
  }
}

function updateEffect(dt){
  const e=g.effect;
  if(!e)return false;
  e.time+=dt;

  if(e.kind==='rocket'){
    const f=Math.min(5,Math.floor(e.time/.16));
    if(f!==e.last){
      if(e.last>=0)put(ASSETS.explosion[e.last],g.posR,159,'xor');
      put(ASSETS.explosion[f],g.posR,159,'xor');
      e.last=f;
      beep(120+Math.random()*500,.2);
    }
    if(e.time>=1.05){
      put(ASSETS.explosion[e.last],g.posR,159,'xor');
      const fn=e.after;
      g.effect=null;
      fn();
    }
    return true;
  }

  if(e.kind==='lastAlien'){
    // Esplosione sospesa nel cielo: simmetrica, più leggibile e senza appoggiarsi al pavimento.
    const step=.10;
    const growEnd=6*step;
    const holdEnd=growEnd+.15;
    const shrinkEnd=holdEnd+5*step;
    let frame=-1;

    if(e.time<growEnd){
      frame=Math.min(5,Math.floor(e.time/step));
    }else if(e.time<holdEnd){
      frame=5;
    }else if(e.time<shrinkEnd){
      frame=Math.max(0,4-Math.floor((e.time-holdEnd)/step));
    }

    if(frame>=0&&frame!==e.lastFrame){
      if(e.lastFrame>=0)drawSkyAlienExplosion(e.lastFrame,e.cx,e.cy,'xor');
      drawSkyAlienExplosion(frame,e.cx,e.cy,'xor');
      e.lastFrame=frame;

      const rising=e.time<holdEnd;
      const tone=rising?220+frame*120:260+frame*70;
      beep(tone,.12);
    }

    if(e.time>=shrinkEnd&&!e.cleared){
      if(e.lastFrame>=0)drawSkyAlienExplosion(e.lastFrame,e.cx,e.cy,'xor');
      e.lastFrame=-1;
      e.cleared=true;
    }

    // Dopo il completo riassorbimento, aspetta un secondo e poi passa oltre.
    if(e.time>=shrinkEnd+1){
      const fn=e.after;
      g.effect=null;
      fn();
    }
    return true;
  }

  if(e.kind==='ufo'){
    const f=Math.floor(e.time/.08)%2;
    if(f!==e.last){
      if(e.last>=0)put(ASSETS.ufo[g.ufoVariant][e.last?2:g.ufoFrame],g.ufoX,15,'xor');
      put(ASSETS.ufo[g.ufoVariant][f?2:g.ufoFrame],g.ufoX,15,'xor');
      e.last=f;
      beep(100+e.time*900,.15);
    }
    if(e.time>=.8){
      put(ASSETS.ufo[g.ufoVariant][e.last?2:g.ufoFrame],g.ufoX,15,'xor');
      g.flagUfo=false;
      addScore(200+g.ufoVariant*150);
      g.effect=null;
    }
    return true;
  }

  return false;
}

function updatePlayerShot(){
  if(g.fire===1){
    g.shotX=g.posR+6;
    g.shotY=148;
    g.fire=2;
    put(ASSETS.shot,g.shotX,g.shotY,'pset');
  }
  if(g.fire!==2)return;

  put(ASSETS.shot,g.shotX,g.shotY,'xor');
  g.shotY-=g.veCoP;

  if(g.shotY<5){
    g.fire=0;
    return;
  }

  const pf=
    point(g.shotX+1,g.shotY)+
    point(g.shotX+1,g.shotY+3)+
    point(g.shotX,g.shotY+1)+
    point(g.shotX+2,g.shotY+2);

  if(pf){
    put(ASSETS.shot,g.shotX,g.shotY,'xor');
    g.fire=0;

    const old=g.maMM;
    let finalExplosion=null;

    for(let c=0;c<10;c++){
      for(let r=0;r<5;r++){
        if(!g.linea[r][c])continue;

        let col=0;
        if(g.shotX>c*25+g.mPos&&g.shotX<c*25+g.mPos+22)col++;
        if(g.shotY>(r+1)*15+g.poVeMo-1&&g.shotY<(r+1)*15+g.poVeMo+12)col++;

        if(col===2){
          const alienX=c*25+2+g.mPos;
          const alienY=(r+1)*15+g.poVeMo;

          g.linea[r][c]=0;
          put(ASSETS.alien[r][g.b],alienX,alienY,'xor');
          g.maMM++;
          addScore(10);
          beep(200,.5);
          if(g.maMM>25-g.level*3)addScore(5*g.level);

          if(g.maMM===50){
            // Centra l'esplosione pixel sull'ultimo invasore.
            finalExplosion={x:alienX+10,y:alienY+6};
          }
        }
      }
    }

    if(finalExplosion){
      // Nel ramo collisione il colpo è stato temporaneamente ridisegnato
      // nella nuova posizione. Lo eliminiamo prima di congelare il campo.
      put(ASSETS.shot,g.shotX,g.shotY,'xor');
      g.fire=0;

      recomputeFormation();
      beginLastAlienExplosion(finalExplosion.x,finalExplosion.y);
      return;
    }

    if(
      old===g.maMM&&
      g.flagUfo&&
      g.shotX>g.ufoX&&g.shotX<g.ufoX+25&&
      g.shotY>14&&g.shotY<25
    ){
      put(ASSETS.shot,g.shotX,g.shotY,'xor');
      hitUfo();
      return;
    }

    qmmUpdate();
    recomputeFormation();
  }

  put(ASSETS.shot,g.shotX,g.shotY,'xor');
}

  Object.assign(joke,{phase:0,acc:0,x:10,b:0,uX:290,uY:10,uF:0,bullets:[],t:0,bonusTime:2.8});
  awardLife('INTERMEZZO');
  drawJoke1();
}
function drawJoke1(){jokeBase();rect(0,150,319,160,1);hline(0,154,319,0,0xF0F0);put(ASSETS.alien[3][joke.b],joke.x,146,'or');if(joke.uX<310)put(ASSETS.ufo[0][joke.uF],joke.uX,joke.uY,'xor');for(const s of joke.bullets)put(ASSETS.enemyShot,s.x,s.y,'xor')}
function updateJoke1(dt){
  if(joke.bonusTime>0)joke.bonusTime=Math.max(0,joke.bonusTime-dt);
  if(hit('Enter')||hit('Space')){stopMusic();initNewLevel(3);return}
  joke.acc+=dt;
  if(joke.acc<.08)return;
  joke.acc=0;
  joke.t++;
  if(joke.phase===0){
    joke.x+=2;
    if(joke.x>=24&&joke.x<68){joke.uX-=12;joke.uY+=joke.x/25}
    else if(joke.x>=88&&joke.x<106){joke.uX+=8;joke.uY+=5}
    joke.uF^=1;
    if(joke.x>=102){joke.phase=1;joke.x=104}
  }else{
    joke.x+=5;
    joke.uX=Math.min(300,joke.uX+5.3);
    if([115,144,164,174,194,204,219,229,244,259,274].some(v=>Math.abs(joke.x-v)<3))
      joke.bullets.push({x:joke.uX+12,y:joke.uY+9});
    for(const s of joke.bullets)s.y+=5;
    joke.bullets=joke.bullets.filter(s=>s.y<=150);
    if(joke.x>294){stopMusic();initNewLevel(3);return}
  }
  joke.b^=1;
  drawJoke1();
}
function initJoke2(){
  playBasic(MUS2);
  Object.assign(joke,{
    phase:0,acc:0,elapsed:0,
    uX:5,uY:150,uF:0,
    p1:5,p2:-35,f1:7,f2:5,
    bombX:258,bombY:54,bombActive:false,
    impactTimer:0,impactFrame:0,lastImpactFrame:-1,
    bonusTime:2.8
  });
  awardLife('INTERMEZZO');
  drawJoke2();
}
function finishJoke2(){
  stopMusic();
  initNewLevel(5);
}
function drawJoke2(){
  jokeBase();

  if(joke.uX<310&&joke.uY>-45)
    put(ASSETS.ufo[1][joke.uF&1],joke.uX,joke.uY,'or');

  if(joke.phase===0)return;

  // Prima dell'impatto: Pac-Man fugge verso destra e il fantasma rosso lo insegue.
  // Dopo l'impatto: il fantasma diventa grigio e fugge verso sinistra,
  // mentre Pac-Man si gira e lo insegue.
  const pacFrame=joke.phase===3
    ? ((joke.f1%3)+3)%3
    : 7+((((joke.f1-7)%3)+3)%3);
  const ghostFrame=joke.phase>=2
    ? 3+((((joke.f2-3)%2)+2)%2)
    : 5+((((joke.f2-5)%2)+2)%2);

  if(joke.p1>-30&&joke.p1<310)
    put(ASSETS.pac[pacFrame],joke.p1,100,'or');

  if(joke.phase!==2&&joke.p2>-30&&joke.p2<310)
    put(ASSETS.pac[ghostFrame],joke.p2,100,'or');

  if(joke.phase===1&&joke.bombActive)
    put(ASSETS.enemyShot,joke.bombX,joke.bombY,'or');

  if(joke.phase===2){
    // L'esplosione è centrata sul fantasma: la causa-effetto della bomba
    // rimane visibile per quasi un secondo.
    const ef=Math.min(5,joke.impactFrame);
    put(ASSETS.explosion[ef],joke.p2-1,94,'or');
    if(joke.impactTimer>.52)
      put(ASSETS.pac[ghostFrame],joke.p2,100,'or');
  }

  if(joke.phase===3&&joke.p2>-30&&joke.p2<310)
    put(ASSETS.pac[ghostFrame],joke.p2,100,'or');
}
function updateJoke2(dt){
  if(joke.bonusTime>0)joke.bonusTime=Math.max(0,joke.bonusTime-dt);
  if(hit('Enter')||hit('Space')){finishJoke2();return}

  joke.elapsed=(joke.elapsed||0)+dt;

  if(joke.phase===2){
    joke.impactTimer+=dt;
    const f=Math.min(5,Math.floor(joke.impactTimer/.14));
    if(f!==joke.lastImpactFrame){
      joke.lastImpactFrame=f;
      joke.impactFrame=f;
      beep(150+f*95,.22);
    }
    // L'UFO continua ad allontanarsi durante l'esplosione.
    joke.uX+=dt*11;
    joke.uY-=dt*4.4;
    if(joke.impactTimer>=1.0){
      joke.phase=3;
      joke.acc=0;
      joke.f1=0; // Pac-Man rivolto a sinistra
      joke.f2=3; // fantasma grigio
    }
    drawJoke2();
    return;
  }

  joke.acc+=dt;
  const step=joke.phase===0?.1:.055;
  if(joke.acc<step)return;
  joke.acc=0;
  joke.uF^=1;

  if(joke.phase===0){
    // Come nel BASIC originale, l'UFO sale ma si ferma orizzontalmente a x=200.
    if(joke.uX<200)joke.uX+=2.5;
    joke.uY-=.95;
    if(joke.uY<71.2)joke.phase=1;
  }else if(joke.phase===1){
    joke.p1+=2.5;
    joke.p2+=2.6;
    joke.f1++; if(joke.f1===10)joke.f1=7;
    joke.f2++; if(joke.f2===7)joke.f2=5;
    joke.uX+=.5;
    joke.uY-=.2;

    if(!joke.bombActive&&joke.uX>248){
      joke.bombActive=true;
      joke.bombX=258;
      joke.bombY=54;
    }
    if(joke.bombActive)joke.bombY+=3.8;

    if(joke.bombActive&&joke.bombY>=104){
      // All'impatto il fantasma viene allineato alla traiettoria della bomba,
      // così si vede chiaramente che è lui a essere colpito.
      joke.p2=joke.bombX-8;
      joke.bombActive=false;
      joke.phase=2;
      joke.impactTimer=0;
      joke.impactFrame=0;
      joke.lastImpactFrame=-1;
    }
  }else{
    // Inseguimento inverso: il fantasma grigio è davanti,
    // Pac-Man lo rincorre da destra verso sinistra.
    joke.p1-=3.75;
    joke.p2-=3.05;
    joke.f1=(joke.f1+1)%3;
    joke.f2=3+((joke.f2-3+1)%2);
    joke.uX+=.5;
    joke.uY-=.2;

    if(joke.p1<=joke.p2+13||joke.p1<=5){
      finishJoke2();
      return;
    }
  }

  if(joke.elapsed>30){finishJoke2();return}
  drawJoke2();
}
function initJoke3(){
  jokeBase();
  playBasic(MUS3);
  Object.assign(joke,{
    phase:0,phaseTime:0,elapsed:0,animAcc:0,
    pX:46,pY:147,pF:0,
    aliens:[
      {x:18,baseY:148,jump:0},
      {x:-4,baseY:148,jump:0},
      {x:-26,baseY:148,jump:0}
    ],
    mF:0,
    uX:335,uY:25,uF:0,
    beam:0,abduct:0,blue:0,warp:0,
    soundAcc:0
  });
  drawJoke3();
}
function finishJoke3(){stopMusic();initNewLevel(3)}

function putTinted(sp,x,y,mode='or'){
  x=qi(x);y=qi(y);
  for(let j=0;j<sp.length;j++){
    const row=sp[j],yy=y+j;
    if(yy<0||yy>=H)continue;
    for(let i=0;i<row.length;i++){
      const xx=x+i;if(xx<0||xx>=W)continue;
      const c=parseInt(row[i],16)||0;if(!c)continue;
      // Rimappatura azzurra, conservando luci, ombre e dettagli dello sprite.
      const nc=c>=14?15:c>=10?11:c>=7?9:c>=4?3:1;
      const p=yy*W+xx;
      if(mode==='xor')pixels[p]^=nc;
      else if(mode==='pset')pixels[p]=nc;
      else pixels[p]|=nc;
    }
  }
}
function drawTractorBeam(cx,topY,bottomY,amount,pulse){
  amount=Math.max(0,Math.min(1,amount));
  const end=qi(topY+(bottomY-topY)*amount);
  for(let y=qi(topY);y<=end;y++){
    const t=(y-topY)/Math.max(1,bottomY-topY);
    const half=2+qi(t*18);
    const left=qi(cx-half),right=qi(cx+half);
    const c=((y+pulse)&3)===0?15:(((y+pulse)&1)?11:3);
    for(let x=left;x<=right;x++){
      // Retino trasparente in puro stile VGA: il fascio non copre gli sprite.
      if(((x+y+pulse)&1)===0||x===left||x===right)plot(x,y,c);
    }
  }
}
function drawAlienJump(alien,index){
  let lift=0;
  if(joke.phase>=2){
    const wave=Math.max(0,Math.sin(joke.phaseTime*6.3+index*1.65));
    lift=qi(wave*(13+index*2));
  }
  put(ASSETS.alien[3][joke.mF],alien.x,alien.baseY-lift,'or');
}
function drawWarpJump(){
  const p=Math.max(0,Math.min(1,joke.warp));
  const cx=qi(joke.uX+14),cy=qi(joke.uY+4);

  // Stelle pixel che vengono stirate orizzontalmente durante il salto.
  const stars=[
    [20,18],[54,42],[88,25],[118,57],[148,15],[178,49],
    [214,28],[246,62],[278,20],[302,45],[34,91],[286,99]
  ];
  for(let i=0;i<stars.length;i++){
    const [sx,sy]=stars[i],len=2+qi(p*(8+(i%4)*4));
    hline(sx-len,sy,sx+len,(i%3===0)?11:((i%3===1)?9:3));
  }

  if(p<.58){
    // L'UFO azzurro si comprime e lascia scie energetiche.
    putTinted(ASSETS.ufo[1][joke.uF],joke.uX,joke.uY,'or');
    const trail=qi(8+p*65);
    for(let k=0;k<6;k++){
      const yy=cy-5+k*2;
      hline(cx-trail-k*2,yy,cx-15,yy,k%2?9:11,0xCCCC);
      hline(cx+15,yy,cx+trail+k*2,yy,k%2?3:11,0xCCCC);
    }
  }else{
    // Flash finale: l'astronave scompare in un punto azzurro.
    const q=(p-.58)/.42;
    const radius=Math.max(1,qi((1-q)*17));
    hline(cx-radius,cy,cx+radius,15);
    line(cx,cy-radius,cx,cy+radius,11);
    for(let r=2;r<=radius;r+=4){
      plot(cx-r,cy-r,9);plot(cx+r,cy-r,3);
      plot(cx-r,cy+r,3);plot(cx+r,cy+r,9);
    }
  }
}
function drawJoke3(){
  jokeBase();

  // Terreno e piccole stelle, tutto a pixel interi.
  rect(0,160,319,164,1);
  hline(0,159,319,9,0xAAAA);
  const sky=[[16,24],[42,55],[76,19],[107,72],[139,34],[166,59],[235,18],[273,73],[305,38]];
  for(let i=0;i<sky.length;i++)plot(sky[i][0],sky[i][1],i%2?9:11);

  if(joke.phase<4){
    if(joke.phase>=1&&joke.phase<=3){
      const beamAmount=joke.phase===1?joke.beam:(joke.phase===3?1-joke.beam:1);
      if(beamAmount>0)drawTractorBeam(joke.uX+14,joke.uY+8,158,beamAmount,qi(joke.elapsed*18));
    }

    // Tre alieni sempre chiaramente visibili sotto l'omino/UFO.
    for(let i=0;i<joke.aliens.length;i++)drawAlienJump(joke.aliens[i],i);

    // L'omino scompare solo quando è completamente dentro l'UFO.
    if(joke.phase<3||joke.pY>joke.uY+6)put(ASSETS.player[joke.pF],joke.pX,joke.pY,'or');

    if(joke.blue)putTinted(ASSETS.ufo[1][joke.uF],joke.uX,joke.uY,'or');
    else put(ASSETS.ufo[1][joke.uF],joke.uX,joke.uY,'or');
  }else{
    // Gli alieni restano sotto e continuano a saltare mentre l'UFO fugge.
    for(let i=0;i<joke.aliens.length;i++)drawAlienJump(joke.aliens[i],i);
    drawWarpJump();
  }
}
function updateJoke3(dt){
  if(hit('Enter')||hit('Space')){finishJoke3();return}

  joke.elapsed+=dt;
  joke.phaseTime+=dt;
  joke.animAcc+=dt;
  joke.soundAcc+=dt;

  if(joke.animAcc>=.10){
    joke.animAcc=0;
    joke.pF=(joke.pF+1)%3;
    joke.mF^=1;
    joke.uF^=1;
  }

  if(joke.phase===0){
    // FUGA: omino davanti, tre alieni chiaramente dietro.
    joke.pX+=31*dt;
    for(let i=0;i<3;i++){
      const target=joke.pX-(27+i*22);
      joke.aliens[i].x+=Math.min(36*dt,Math.max(0,target-joke.aliens[i].x));
    }

    // L'UFO entra dall'alto a destra e si posiziona sopra il giocatore.
    if(joke.elapsed>1.55){
      joke.uX=Math.max(190,joke.uX-55*dt);
      joke.uY=Math.min(30,joke.uY+4*dt);
    }

    if(joke.pX>=198&&joke.uX<=193){
      joke.pX=198;
      joke.phase=1;
      joke.phaseTime=0;
      beep(900,.8);
    }
  }else if(joke.phase===1){
    // Il fascio scende fino a terra; gli inseguitori si raccolgono sotto.
    joke.beam=Math.min(1,joke.phaseTime/1.15);
    const targets=[170,196,222];
    for(let i=0;i<3;i++){
      const d=targets[i]-joke.aliens[i].x;
      joke.aliens[i].x+=Math.sign(d)*Math.min(Math.abs(d),28*dt);
    }
    joke.pX+=(joke.uX+10-joke.pX)*Math.min(1,dt*3.5);

    if(joke.phaseTime>=1.3){
      // Posizioni definitive e separate sotto il fascio:
      // i tre alieni devono essere sempre riconoscibili durante i salti.
      joke.aliens[0].x=170;
      joke.aliens[1].x=196;
      joke.aliens[2].x=222;
      joke.phase=2;
      joke.phaseTime=0;
      beep(1450,1.4);
    }
  }else if(joke.phase===2){
    // RAPIMENTO: l'omino sale nel fascio; i tre alieni saltano senza raggiungerlo.
    joke.pX+=(joke.uX+10-joke.pX)*Math.min(1,dt*5);
    joke.pY=Math.max(joke.uY+4,joke.pY-44*dt);

    if(joke.soundAcc>.28){
      joke.soundAcc=0;
      beep(520+joke.pY*4,.22);
    }

    if(joke.pY<=joke.uY+5){
      joke.phase=3;
      joke.phaseTime=0;
      joke.blue=1;
      joke.beam=1;
      beep(1900,1.5);
    }
  }else if(joke.phase===3){
    // Il fascio si richiude mentre l'UFO diventa azzurro.
    joke.beam=Math.max(0,1-joke.phaseTime/.85);
    if(joke.phaseTime>=1.05){
      joke.phase=4;
      joke.phaseTime=0;
      joke.warp=0;
      stopMusic();
      beep(2400,2.5);
    }
  }else{
    // SALTO INTERSTELLARE: compressione, scie azzurre e sparizione.
    joke.warp=Math.min(1,joke.phaseTime/1.35);
    if(joke.soundAcc>.08){
      joke.soundAcc=0;
      beep(700+2600*joke.warp,.18,0,.025);
    }
    if(joke.phaseTime>=1.55){
      finishJoke3();
      return;
    }
  }

  drawJoke3();
}

// Le vecchie funzioni di esplosione restano come compatibilità,
// ma non vengono più usate dal nuovo intermezzo 3.
function beginJokeRocketBoom(){finishJoke3()}
function updateJoke3Boom(dt){finishJoke3()}
function initNewLevel(n){stopMusic();Object.assign(joke,{levelText:n,phase:0,acc:0,row:2,time:0});switchMode('newlevel');cls()}
function finishNewLevel(){setupLevel()}
function updateNewLevel(dt){if(hit('Enter')||hit('Space'))joke.time=99;joke.time+=dt;joke.acc+=dt;if(joke.phase===0&&joke.acc>=.14){joke.acc=0;rect(0,145,319,150,0);rect(0,150,319,160,2);hline(0,154,319,15,0xF0F0);printCell(Math.max(1,joke.row-1),8,'You have reached LEVEL '+joke.levelText+'!',0);printCell(joke.row,8,'You have reached LEVEL '+joke.levelText+'!',joke.row);joke.row++;if(joke.row>11)joke.phase=1}else if(joke.phase===1){const c=55+Math.floor(joke.time*12)%36;printCell(11,8,'You have reached LEVEL '+joke.levelText+'!',c);beep(200+joke.time*120,.09);if(joke.time>3.5){finishNewLevel()}}}
function finishGame(invasion){stopMusic();g.invasion=invasion;switchMode('gameover',()=>{gameOver.time=0;printCell(10,10,'GAME OVER!',14)})}
const gameOver={};function updateGameOver(dt){gameOver.time+=dt;if(gameOver.time>2||hit('Enter')||hit('Space')){const qualifies=g.score>scores[scores.length-1].score;if(qualifies){nameState.value='';switchMode('name',drawNameScreen)}else switchMode('topten',initTopTen)}}
const nameState={value:''};function drawNameScreen(){cls();printCell(4,11,'YOU ARE QUALIFIED!',14);printCell(6,6,'Please, enter your name',15);printCell(8,8,nameState.value.padEnd(18,'_'),14);printCell(12,5,'ENTER confirms · BACKSPACE deletes',7)}
function nameKey(e){if(app.mode!=='name')return;if(e.code==='Enter'){const name=(nameState.value.trim()||'PLAYER').slice(0,18).padEnd(18);scores.push({name,score:g.score});scores.sort((a,b)=>b.score-a.score);scores=scores.slice(0,10);saveScores();switchMode('topten',initTopTen);return}if(e.code==='Backspace'){nameState.value=nameState.value.slice(0,-1);drawNameScreen();return}if(e.key.length===1&&nameState.value.length<18&&/[A-Za-zÀ-ÿ0-9 .,'+*?!()\[\]_-]/.test(e.key)){nameState.value+=e.key;drawNameScreen()}else beep(3000,.5)}
function updateName(){if(hit('Escape'))switchMode('topten',initTopTen)}
function main(now){const dt=Math.min(.05,(now-(main.last||now))/1000);main.last=now;app.time+=dt;switch(app.mode){case'presentation':updatePresentation(dt);break;case'topten':updateTopTen(dt);break;case'game':updateGame(dt);break;case'pause':updatePause(dt);break;case'joke1':updateJoke1(dt);break;case'joke2':updateJoke2(dt);break;case'joke3':updateJoke3(dt);break;case'joke3boom':updateJoke3Boom(dt);break;case'joke4':updateNewLevel(dt);break;case'newlevel':updateNewLevel(dt);break;case'gameover':updateGameOver(dt);break;case'name':updateName(dt);break}render();pressed.clear();requestAnimationFrame(main)}
window.__aldusDebug={ASSETS,pixels,app,g,startNewGame,setupLevel,switchMode,initPresentation,initJoke1,initJoke2,initJoke3};
initPresentation();requestAnimationFrame(main);
</script>
